# A shared Town: people sign in with GitHub or Google and work on the same
# repositories, decisions and Assistant conversations.
#
#   BT_PUBLIC_URL=https://town.example.com \
#     docker compose -f docker-compose.yml -f docker-compose.multi-user.yml up --build
#
# Put a TLS-terminating reverse proxy in front of Town's published port and set
# BT_PUBLIC_URL to the address people open. Town reads the OAuth client IDs
# and the allowlist from brokk-auth.env, and the client secrets from files in
# ./brokk-auth (readable by uid 10001), so neither reaches a bot. See
# "Shared Town" in docs/operations.md.
services:
  bt:
    command: ["--public-url", "${BT_PUBLIC_URL:?set BT_PUBLIC_URL to the https:// address people open}", "--multi-user"]
    env_file:
      - path: ./brokk.env
        required: false
      - path: ./brokk-auth.env
        required: true
    volumes:
      - type: bind
        source: ./brokk-auth
        target: /run/secrets/brokk-oauth
        read_only: true
