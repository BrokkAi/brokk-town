# Demo mode: Town runs its simulated repositories and every bot answers with a
# canned result, so no GitHub token or agent key is needed. Town still sends
# each bot a dispatch over the network every few minutes and records the
# answer in Activity.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
services:
  bt:
    command: ["--public-url", "http://127.0.0.1:${BT_PORT:-8080}", "--demo"]
  bug-bot:
    environment:
      BROKK_BOT_DEMO: "1"
  feature-bot:
    environment:
      BROKK_BOT_DEMO: "1"
  issue-bot:
    environment:
      BROKK_BOT_DEMO: "1"
  review-bot:
    environment:
      BROKK_BOT_DEMO: "1"
  release-bot:
    environment:
      BROKK_BOT_DEMO: "1"
  simplifier-bot:
    environment:
      BROKK_BOT_DEMO: "1"
  repo-bot:
    environment:
      BROKK_BOT_DEMO: "1"
  mayor-bot:
    environment:
      BROKK_BOT_DEMO: "1"
