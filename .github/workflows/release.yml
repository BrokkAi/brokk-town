name: Release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build all native and npm deliverables without publication
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release_checks.py build
      - name: Retain exact-commit candidate and build evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-candidate-${{ github.sha }}-${{ inputs.tag }}
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 14
