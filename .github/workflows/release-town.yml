name: Release
on:
  push:
    tags: ['v*']
  # The nightly workflow calls this after it tags a green master.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: write
jobs:
  images:
    # One image per bot and one for Town: the release itself. A nightly call
    # runs on master's ref, so the tag comes from its input.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [bt, bug-bot, feature-bot, issue-bot, review-bot, release-bot, simplifier-bot, repo-bot, mayor-bot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ inputs.tag || github.ref_name }}
          push: true
          provenance: false
          tags: |
            ghcr.io/brokkai/brokk-town/${{ matrix.target }}:${{ inputs.tag || github.ref_name }}
            ghcr.io/brokkai/brokk-town/${{ matrix.target }}:latest
  release:
    # The GitHub release follows the images, so it only names a version whose
    # images were all published. It carries the third-party license file.
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sh scripts/licenses.sh
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" licenses/THIRD_PARTY_NOTICES.txt
