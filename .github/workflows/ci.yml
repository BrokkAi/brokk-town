name: CI
# Pushes only run CI on master: a pull request branch is already covered by its
# pull_request run, and a release tag by the release workflow's own call.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A newer push to a pull request cancels its older run so it stops holding a
# runner. Master and release runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # One runner per platform covers every module. Fanning the nine modules out
    # across nine runners per platform asked for nine macOS machines at once,
    # and macOS runners queue: concurrent runs starved each other while the work
    # itself takes under half an hour in total. Every module pins the same Go
    # version, so one toolchain setup serves them all. The account's runner
    # limit is tight, so pull requests run on Ubuntu only; macOS runs on master
    # and releases.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Check every module
        # Every module runs even after one fails, so a single broken module does
        # not hide the rest the way an early exit would.
        run: |
          set -u
          failed=''
          for project in . bots/*; do
            echo "::group::$project"
            (
              cd "$project"
              unformatted="$(gofmt -l .)"
              if [ -n "$unformatted" ]; then
                echo "gofmt reported unformatted files:"
                echo "$unformatted"
                exit 1
              fi
              go test -race ./...
              go vet ./...
              python3 scripts/licenses.py
              python3 -m unittest discover -s scripts -p '*_test.py'
              node --test --test-isolation=none npm/*.test.cjs
              sh -n install.sh
            ) || failed="$failed $project"
            echo '::endgroup::'
          done
          if [ -n "$failed" ]; then
            echo "failed modules:$failed"
            exit 1
          fi
      - name: Build the bundle and smoke the workers
        run: npm run check && npm test && make build && python3 scripts/smoke.py && python3 scripts/smoke_workers.py && python3 scripts/smoke_mjolnir.py
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
