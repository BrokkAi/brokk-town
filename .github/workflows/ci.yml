name: CI
# Pushes only run CI on master: a pull request branch is already covered by its
# pull_request run.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A newer push to a pull request cancels its older run so it stops holding a
# runner. Master and release runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # One runner per platform covers the root module and every bot. Fanning the
    # projects out across separate runners per platform asked for nine macOS
    # machines at once, and macOS runners queue: concurrent runs starved each
    # other while the work itself takes under half an hour in total. The bots
    # share the root module and its Go version, so one toolchain setup serves
    # them all. The account's runner limit is tight, so pull requests run on
    # Ubuntu only; macOS runs on master.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Check the module
        # One module covers Town and every bot, so the whole package tree is
        # checked in a single pass. The browser checks and the build run once
        # for Town below.
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          go test -race ./...
          go vet ./...
      - name: Check the license file is current
        run: |
          sh scripts/licenses.sh
          git diff --exit-code -- licenses/THIRD_PARTY_NOTICES.txt
      - name: Build bt and the bot binaries
        run: make js && make build
  windows:
    # Windows runs the whole module build, vet and tests under PowerShell. It
    # is separate from the matrix because the Unix steps use a POSIX shell, and
    # the account's runner limit keeps pull requests on Ubuntu.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the module
        run: |
          go build ./...
          go vet ./...
          go test -timeout 30m ./...
  deploy:
    # Builds every image, then brings Town and the eight bots up twice in demo
    # mode: with docker compose, and on a kind cluster from the Kubernetes
    # manifests. Each time Town must reach every bot over the network.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BROKK_TOWN_IMAGES: brokk-town
      BROKK_TOWN_VERSION: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate the Kubernetes manifests
        run: |
          deploy/kubernetes/generate-secrets.sh
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform
          for overlay in base demo multi-user; do
            kubectl kustomize "deploy/kubernetes/$overlay" | kubeconform -strict -summary -
          done
      - name: Build the images
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml build
      - name: Docker compose round trip
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
          scripts/demo-dispatch-check.sh docker compose exec -T bt bt status --json --demo --state-dir /data
      - name: Compose logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --no-color | tail -n 300
      - name: Stop compose
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa
        with:
          cluster_name: brokk-town
      - name: Kubernetes round trip
        run: |
          for image in bt bug-bot feature-bot issue-bot review-bot release-bot simplifier-bot repo-bot mayor-bot; do
            kind load docker-image --name brokk-town "brokk-town/$image:ci"
          done
          kubectl kustomize deploy/kubernetes/demo \
            | sed -E 's#ghcr.io/brokkai/brokk-town/([a-z-]+):latest#brokk-town/\1:ci#' \
            | kubectl apply -f -
          for deployment in bt bug-bot feature-bot issue-bot review-bot release-bot simplifier-bot repo-bot mayor-bot; do
            kubectl -n brokk-town rollout status "deployment/$deployment" --timeout=5m
          done
          scripts/demo-dispatch-check.sh kubectl -n brokk-town exec deploy/bt -- bt status --json --demo --state-dir /data
      - name: Kubernetes diagnostics
        if: failure()
        run: |
          kubectl -n brokk-town get pods -o wide || true
          kubectl -n brokk-town describe pods | tail -n 200 || true
          kubectl -n brokk-town logs deploy/bt --tail=200 || true
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
