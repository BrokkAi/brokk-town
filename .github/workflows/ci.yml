name: CI
# Pushes only run CI on master: a pull request branch is already covered by its
# pull_request run.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A newer push to a pull request cancels its older run so it stops holding a
# runner. Master and release runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    # Town and its bots run only in Linux containers, so one Linux runner
    # covers the root module and every bot. The bots share the root module
    # and its Go version, so one toolchain setup serves them all.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Check the module
        # One module covers Town and every bot, so the whole package tree is
        # checked in a single pass. The browser checks and the build run once
        # for Town below.
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi
          go test -race ./...
          go vet ./...
      - name: Check the license file is current
        run: |
          sh scripts/licenses.sh
          git diff --exit-code -- licenses/THIRD_PARTY_NOTICES.txt
      - name: Build bt and the bot binaries
        run: make js && make build
  deploy:
    # Builds every image, then brings Town and the eight bots up on a kind
    # cluster from the Kubernetes manifests, with placeholder sign-in. Town
    # must start, and its pod must reach every bot over the network with that
    # bot's token.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate the Kubernetes manifests
        run: |
          deploy/kubernetes/generate-secrets.sh
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform
          kubectl kustomize deploy/kubernetes | kubeconform -strict -summary -
      - name: Build the images
        run: make images IMAGES=brokk-town IMAGE_TAG=ci
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa
        with:
          cluster_name: brokk-town
      - name: Kubernetes round trip
        run: |
          # Placeholder sign-in: Town needs an OAuth client and an allowlist
          # to start, and nobody signs in here.
          cat > deploy/kubernetes/auth.env <<'AUTH'
          BROKK_TOWN_GITHUB_CLIENT_ID=ci-placeholder
          BROKK_TOWN_GITHUB_CLIENT_SECRET_FILE=/run/secrets/brokk-oauth/github-client-secret
          BROKK_TOWN_ALLOW_GITHUB_USERS=octocat
          AUTH
          printf 'github-client-secret=ci-placeholder\n' > deploy/kubernetes/oauth-secrets.env
          for image in bt bug-bot feature-bot issue-bot review-bot release-bot simplifier-bot repo-bot mayor-bot; do
            kind load docker-image --name brokk-town "brokk-town/$image:ci"
          done
          kubectl kustomize deploy/kubernetes \
            | sed -E 's#ghcr.io/brokkai/brokk-town/([a-z-]+):latest#brokk-town/\1:ci#' \
            | kubectl apply -f -
          for deployment in bt bug-bot feature-bot issue-bot review-bot release-bot simplifier-bot repo-bot mayor-bot; do
            kubectl -n brokk-town rollout status "deployment/$deployment" --timeout=5m
          done
          kubectl -n brokk-town exec deploy/bt -- bt status
          kubectl -n brokk-town exec deploy/bt -- sh -ec '
            curl -fsS http://127.0.0.1:8080/api/session | grep -q github
            for bot in bug-bot feature-bot issue-bot review-bot release-bot simplifier-bot repo-bot mayor-bot; do
              identity="$(curl -fsS -H "Authorization: Bearer $(cat "/run/secrets/brokk/$bot/token")" "http://$bot:8080/v1/identity")"
              echo "$identity"
              printf "%s" "$identity" | grep -q "\"name\":\"$bot\""
            done
            echo "every bot answered Town over the network"'
      - name: Kubernetes diagnostics
        if: failure()
        run: |
          kubectl -n brokk-town get pods -o wide || true
          kubectl -n brokk-town describe pods | tail -n 200 || true
          kubectl -n brokk-town logs deploy/bt --tail=200 || true
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
