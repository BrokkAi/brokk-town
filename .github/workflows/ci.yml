name: CI
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        project: [".", "bots/bug-bot", "bots/feature-bot", "bots/issue-bot", "bots/review-bot", "bots/release-bot", "bots/repo-bot", "bots/simplifier-bot", "bots/mayor-bot"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ matrix.project }}/go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 scripts/licenses.py
      - run: python3 -m unittest discover -s scripts -p '*_test.py'
      - run: node --test --test-isolation=none npm/*.test.cjs
      - run: sh -n install.sh
      - if: matrix.project == '.'
        run: npm run check && npm test && make build && python3 scripts/smoke.py && python3 scripts/smoke_workers.py
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
