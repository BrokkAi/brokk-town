# Brokk Town with each bot in its own container.
#
#   docker compose up --build            # real mode: set GH_TOKEN and agent keys in brokk.env
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
#
# Town is served on http://127.0.0.1:8080 (see "docker compose exec bt bt web
# --state-dir /data" for the link with its access key). Each bot keeps its
# workspaces on its own volume and accepts only the token generated for it on
# first start. See docs/operations.md.
name: brokk-town

x-bot: &bot
  restart: unless-stopped
  depends_on:
    bot-tokens:
      condition: service_completed_successfully
  env_file:
    - path: ./brokk.env
      required: false
  read_only: true
  tmpfs: [/tmp]
  environment:
    BROKK_BOT_TOKEN_FILE: /run/secrets/brokk/token
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/healthz"]
    interval: 10s
    timeout: 3s
    retries: 6

services:
  # Generates one random token per bot on first start. Each bot mounts only its
  # own; Town mounts them all.
  bot-tokens:
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/bt:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: bt}
    user: "0:0"
    entrypoint: ["sh", "-ec"]
    command:
      - |
        for bot in bug-bot feature-bot issue-bot review-bot release-bot simplifier-bot repo-bot mayor-bot; do
          mkdir -p "/tokens/$$bot"
          if [ ! -s "/tokens/$$bot/token" ]; then
            head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "/tokens/$$bot/token"
          fi
          chown -R 10001:10001 "/tokens/$$bot"
          chmod 0500 "/tokens/$$bot"
          chmod 0400 "/tokens/$$bot/token"
        done
    volumes:
      - bot-tokens:/tokens

  bt:
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/bt:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: bt}
    restart: unless-stopped
    command: ["--public-url", "http://127.0.0.1:${BT_PORT:-8080}"]
    ports:
      - "127.0.0.1:${BT_PORT:-8080}:8080"
    env_file:
      - path: ./brokk.env
        required: false
    read_only: true
    tmpfs: [/tmp]
    environment:
      BROKK_TOWN_CALLBACK_URL: http://bt:8091
      BROKK_TOWN_BOT_BUG_URL: http://bug-bot:8080
      BROKK_TOWN_BOT_BUG_TOKEN_FILE: /run/secrets/brokk/bug-bot/token
      BROKK_TOWN_BOT_FEATURE_URL: http://feature-bot:8080
      BROKK_TOWN_BOT_FEATURE_TOKEN_FILE: /run/secrets/brokk/feature-bot/token
      BROKK_TOWN_BOT_ISSUE_URL: http://issue-bot:8080
      BROKK_TOWN_BOT_ISSUE_TOKEN_FILE: /run/secrets/brokk/issue-bot/token
      BROKK_TOWN_BOT_REVIEW_URL: http://review-bot:8080
      BROKK_TOWN_BOT_REVIEW_TOKEN_FILE: /run/secrets/brokk/review-bot/token
      BROKK_TOWN_BOT_RELEASE_URL: http://release-bot:8080
      BROKK_TOWN_BOT_RELEASE_TOKEN_FILE: /run/secrets/brokk/release-bot/token
      BROKK_TOWN_BOT_SIMPLIFIER_URL: http://simplifier-bot:8080
      BROKK_TOWN_BOT_SIMPLIFIER_TOKEN_FILE: /run/secrets/brokk/simplifier-bot/token
      BROKK_TOWN_BOT_REPO_URL: http://repo-bot:8080
      BROKK_TOWN_BOT_REPO_TOKEN_FILE: /run/secrets/brokk/repo-bot/token
      BROKK_TOWN_BOT_HALL_URL: http://mayor-bot:8080
      BROKK_TOWN_BOT_HALL_TOKEN_FILE: /run/secrets/brokk/mayor-bot/token
    volumes:
      - bt-data:/data
      - type: volume
        source: bot-tokens
        target: /run/secrets/brokk
        read_only: true
    depends_on:
      bug-bot:
        condition: service_healthy
      feature-bot:
        condition: service_healthy
      issue-bot:
        condition: service_healthy
      review-bot:
        condition: service_healthy
      release-bot:
        condition: service_healthy
      simplifier-bot:
        condition: service_healthy
      repo-bot:
        condition: service_healthy
      mayor-bot:
        condition: service_healthy

  bug-bot:
    <<: *bot
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/bug-bot:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: bug-bot}
    volumes:
      - bug-bot-data:/data
      - type: volume
        source: bot-tokens
        target: /run/secrets/brokk
        read_only: true
        volume:
          subpath: bug-bot

  feature-bot:
    <<: *bot
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/feature-bot:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: feature-bot}
    volumes:
      - feature-bot-data:/data
      - type: volume
        source: bot-tokens
        target: /run/secrets/brokk
        read_only: true
        volume:
          subpath: feature-bot

  issue-bot:
    <<: *bot
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/issue-bot:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: issue-bot}
    volumes:
      - issue-bot-data:/data
      - type: volume
        source: bot-tokens
        target: /run/secrets/brokk
        read_only: true
        volume:
          subpath: issue-bot

  review-bot:
    <<: *bot
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/review-bot:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: review-bot}
    volumes:
      - review-bot-data:/data
      - type: volume
        source: bot-tokens
        target: /run/secrets/brokk
        read_only: true
        volume:
          subpath: review-bot

  release-bot:
    <<: *bot
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/release-bot:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: release-bot}
    volumes:
      - release-bot-data:/data
      - type: volume
        source: bot-tokens
        target: /run/secrets/brokk
        read_only: true
        volume:
          subpath: release-bot

  simplifier-bot:
    <<: *bot
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/simplifier-bot:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: simplifier-bot}
    volumes:
      - simplifier-bot-data:/data
      - type: volume
        source: bot-tokens
        target: /run/secrets/brokk
        read_only: true
        volume:
          subpath: simplifier-bot

  repo-bot:
    <<: *bot
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/repo-bot:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: repo-bot}
    volumes:
      - repo-bot-data:/data
      - type: volume
        source: bot-tokens
        target: /run/secrets/brokk
        read_only: true
        volume:
          subpath: repo-bot

  mayor-bot:
    <<: *bot
    image: ${BROKK_TOWN_IMAGES:-ghcr.io/brokkai/brokk-town}/mayor-bot:${BROKK_TOWN_VERSION:-latest}
    build: {context: ., target: mayor-bot}
    volumes:
      - mayor-bot-data:/data
      - type: volume
        source: bot-tokens
        target: /run/secrets/brokk
        read_only: true
        volume:
          subpath: mayor-bot

volumes:
  bt-data:
  bot-tokens:
  bug-bot-data:
  feature-bot-data:
  issue-bot-data:
  review-bot-data:
  release-bot-data:
  simplifier-bot-data:
  repo-bot-data:
  mayor-bot-data:
