# The demo on Kubernetes: Town runs its simulated repositories and every bot
# answers with a canned result over the network. No GitHub token or agent key
# is needed.
#
#   deploy/kubernetes/generate-secrets.sh
#   kubectl apply -k deploy/kubernetes/demo
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=bot
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BROKK_BOT_DEMO
          value: "1"
  - target:
      kind: Deployment
      name: bt
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --demo
