apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bug-bot-data
  labels:
    app.kubernetes.io/name: bug-bot
    app.kubernetes.io/component: bot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bug-bot
  labels:
    app.kubernetes.io/name: bug-bot
    app.kubernetes.io/component: bot
spec:
  selector:
    app.kubernetes.io/name: bug-bot
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug-bot
  labels:
    app.kubernetes.io/name: bug-bot
    app.kubernetes.io/component: bot
spec:
  replicas: 1
  # One pod owns the volume and its workspaces at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bug-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bug-bot
        app.kubernetes.io/component: bot
    spec:
      automountServiceAccountToken: false
      # Long agent runs report what they completed before the pod goes.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bug-bot
          image: ghcr.io/brokkai/brokk-town/bug-bot:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BROKK_BOT_TOKEN_FILE
              value: /run/secrets/brokk/token
          envFrom:
            - secretRef:
                name: brokk-town-credentials
                optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: token
              mountPath: /run/secrets/brokk
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bug-bot-data
        # Each bot sees only its own token.
        - name: token
          secret:
            secretName: brokk-town-bot-tokens
            defaultMode: 0440
            items:
              - key: bug-bot
                path: token
        - name: tmp
          emptyDir: {}
---
