# A shared Town on Kubernetes: people sign in with GitHub or Google and work
# on the same repositories, decisions and Assistant conversations. Town is
# published through an Ingress that terminates TLS.
#
#   deploy/kubernetes/generate-secrets.sh
#   # fill in deploy/kubernetes/multi-user/auth.env and oauth-secrets.env,
#   # and replace town.example.com in bt-multi-user.yaml and ingress.yaml
#   kubectl apply -k deploy/kubernetes/multi-user
#
# See "Shared Town" in docs/operations.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: brokk-town
resources:
  - ../base
  - ingress.yaml
patches:
  - path: bt-multi-user.yaml
configMapGenerator:
  # OAuth client IDs, the allowlist and where the client secrets are mounted.
  - name: brokk-town-auth
    envs: [auth.env]
    options:
      disableNameSuffixHash: true
secretGenerator:
  # The OAuth client secrets, mounted as files; Town never reads them from
  # its environment.
  - name: brokk-town-oauth
    envs: [oauth-secrets.env]
    options:
      disableNameSuffixHash: true
