version: 2

project_name: brokk-town

before:
  hooks:
    - sh scripts/licenses.sh

builds:
  - id: bt
    main: ./cmd/bt
    binary: bt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}
  # Each bot is its own binary. bt starts the ones installed next to it, so
  # one archive carries them all.
  - id: bug-bot
    main: ./cmd/bug-bot
    binary: bug-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}
  - id: feature-bot
    main: ./cmd/feature-bot
    binary: feature-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}
  - id: issue-bot
    main: ./cmd/issue-bot
    binary: issue-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}
  - id: review-bot
    main: ./cmd/review-bot
    binary: review-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}
  - id: release-bot
    main: ./cmd/release-bot
    binary: release-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}
  - id: simplifier-bot
    main: ./cmd/simplifier-bot
    binary: simplifier-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}
  - id: repo-bot
    main: ./cmd/repo-bot
    binary: repo-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}
  - id: mayor-bot
    main: ./cmd/mayor-bot
    binary: mayor-bot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - id: bt
    ids:
      - bt
      - bug-bot
      - feature-bot
      - issue-bot
      - review-bot
      - release-bot
      - simplifier-bot
      - repo-bot
      - mayor-bot
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - licenses/THIRD_PARTY_NOTICES.txt

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  draft: false
