version: 2

project_name: slopcop-squad

before:
  hooks:
    - sh scripts/licenses.sh

builds:
  - id: sct
    main: ./cmd/sct
    binary: sct
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - id: sct
    ids:
      - sct
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - licenses/THIRD_PARTY_NOTICES.txt

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

release:
  draft: false
